<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: true, theme: 'default' });
  
  // Custom logic to convert Jekyll's raw code blocks into active Mermaid elements
  window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('pre.language-mermaid, code.language-mermaid').forEach((el) => {
      const container = document.createElement('div');
      container.className = 'mermaid';
      container.textContent = el.textContent;
      el.closest('pre')?.replaceWith(container) || el.replaceWith(container);
    });
    mermaid.run();
  });
</script>
